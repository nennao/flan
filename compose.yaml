# Local PostgreSQL for development: `docker compose up -d`.
# Matches DATABASE_URL=postgres://flan:flan@localhost:5432/flan_dev
# Data persists in the `pgdata` volume; `docker compose down -v` deletes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flan
      POSTGRES_PASSWORD: flan # local development only
      POSTGRES_DB: flan_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flan -d flan_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
